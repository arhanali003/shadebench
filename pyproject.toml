[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadebench"
version = "0.1.0"
description = "A local, reproducible workbench for bounded image perturbation experiments"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "Pillow>=11.3,<13"]

[project.scripts]
shadebench = "shadebench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
